<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Page Slider</title>
  <link rel="stylesheet" href="style1.css">
</head>
<body>

  <div class="slider">
    
    <input type="radio" name="slide" id="img1" checked>
    <input type="radio" name="slide" id="img2">
    <input type="radio" name="slide" id="img3">
    <input type="radio" name="slide" id="img4">
    <input type="radio" name="slide" id="img5">

    
    <div class="images">
      <img src="https://img.freepik.com/free-photo/lavender-field-sunset-near-valensole_268835-3910.jpg?semt=ais_hybrid&w=740&q=80" alt="Lavender Field">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ1Tnrv29LSvDZ4O4LbY0nNbEygh49f88efww&s" alt="Mountain">
      <img src="https://img.freepik.com/free-photo/closeup-shot-beautiful-butterfly-with-interesting-textures-orange-petaled-flower_181624-7640.jpg?semt=ais_incoming&w=740&q=80" alt="Butterfly">
      <img src="https://www.shutterstock.com/image-photo/sun-sets-behind-mountain-ranges-600nw-2479236003.jpg" alt="Sunset Mountains">
      <img src="https://img.freepik.com/free-photo/woman-beach-with-her-baby-enjoying-sunset_52683-144131.jpg?size=626&ext=jpg" alt="Beach Sunset">
    </div>

    
    <div class="dots">
      <label for="img1"></label>
      <label for="img2"></label>
      <label for="img3"></label>
      <label for="img4"></label>
      <label for="img5"></label>
    </div>
  </div>

</body>
</html>
